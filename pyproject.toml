[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idol-gen"
version = "0.1.0"
description = "One image to a 3D Gaussian splat: a friendly CLI and browser viewer around speridlabs/idol"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Nick Kavassalis", email = "nick@kavassalis.com", url = "https://github.com/nkavassalis" }]
keywords = ["3d", "gaussian-splatting", "image-to-3d", "3dgs", "cli", "vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    # The model itself comes from the upstream SDK: scripts/setup.sh clones and installs it pinned.
    "idol @ git+https://github.com/speridlabs/idol-sdk.git",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.56",
    "diffusers>=0.36",
    "huggingface_hub>=0.34",
    "safetensors>=0.4",
    "tensordict>=0.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "plyfile>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
view = ["viser>=0.2"]
dev = ["viser>=0.2", "ruff>=0.6"]

[project.scripts]
idol-gen = "idol_tools.generate:main"
idol-view = "idol_tools.viewer:main"
idol-app = "idol_tools.app:main"
idol-test = "idol_tools.smoke_test:main"

[project.urls]
Homepage = "https://github.com/nkavassalis/idol-gen"
Upstream = "https://github.com/speridlabs/idol-sdk"
Model = "https://huggingface.co/speridlabs/idol"

[tool.hatch.build.targets.wheel]
packages = ["idol_tools"]

[tool.hatch.metadata]
allow-direct-references = true          # the upstream SDK is pinned by git URL until it is on PyPI

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["idol-sdk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
